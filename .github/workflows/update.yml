name: Wochenbriefing aktualisieren

# Einmal woechentlich, Samstag 03:50 UTC. Zum Zeitpunkt der Ausfuehrung sind
# die US-Schlusskurse vom Freitag sicher verbucht und die Woche vollstaendig
# erfasst.
#
# Die krumme Minute ist der Grund, warum hier nicht "0 4" steht: GitHub stellt
# geplante Laeufe in eine gemeinsame Warteschlange, die zur runden Stunde am
# laengsten ist, und empfiehlt deshalb ausdruecklich eine andere Minute. Dieser
# Lauf startete im September rund zwoelf Minuten nach der geplanten Zeit, im
# Oktober zwischen vier und sechs Stunden danach - jedes Mal nach der
# Kommentar-Routine, die um 05:00 UTC laeuft.
#
# Darauf verlassen darf man sich nicht: Die Reihenfolge der beiden Stufen ist
# nicht erzwingbar, solange beide an einer Uhr haengen. Deshalb wird sie nicht
# mehr vorausgesetzt - build_kennzahlen.py ueberschreibt eine vorhandene
# Fassung der Routine nicht, und die Seite weist aus, wenn ein Kommentar zu
# einem aelteren Datenstand gehoert.
#
# Die Cron-Zeit ist UTC-fest. Das ist Absicht: Eine in Ortszeit gedachte
# Planung verrutscht bei der Zeitumstellung gegen die Veroeffentlichungstermine
# der Statistikaemter, die ihrerseits UTC- bzw. ortsfest sind.

on:
  schedule:
    - cron: "50 3 * * 6"
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Chart-IDs aktualisieren (Kommaliste, leer = alle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: briefing-aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Daten abrufen
        id: daten
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/build_data.py ${{ github.event.inputs.nur && format('--nur {0}', github.event.inputs.nur) || '' }}

      - name: Kennzahlen rechnen und uebergeben
        # Rechnet nur. Der formulierte Kommentar entsteht in Stufe 2, einer
        # Claude-Code-Cloud-Routine, die data/kennzahlen.json liest und
        # docs/data/commentary.json zurueckschreibt. Hier entsteht ein
        # regelbasierter Grundtext fuer den Fall, dass diese Fassung fehlt
        # oder ueberholt ist - eine vorhandene wird nicht angetastet.
        if: steps.daten.outcome == 'success'
        run: python scripts/build_kennzahlen.py

      - name: Ergebnis committen
        # Nur bei erfolgreichem Datenlauf. Bricht build_data.py wegen
        # Totalausfall ab, wird bewusst nichts committet - sonst wuerde die
        # Seite eine leere oder halbe Datenlage als aktuellen Stand ausgeben.
        if: steps.daten.outcome == 'success'
        run: |
          git config user.name  "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series data/kennzahlen.json docs/data
          if git diff --cached --quiet; then
            echo "Keine Aenderungen - nichts zu committen."
            exit 0
          fi
          git commit -m "Datenstand $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Lauflog sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lauflog
          path: |
            docs/data/meta.json
          if-no-files-found: ignore
          retention-days: 30
